# Auto-generated Engineering DNA from codebase analysis
# This file captures the implicit engineering standards, patterns, and conventions
# used across the project so that AI agents can replicate the same behavior.

architecture_style: service-oriented-modular
controller_style: thin-controller-delegate-to-service
validation_strategy: base-form-request
response_pattern: helper-functions-success-fail
queue_strategy: async-heavy-queued-jobs
frontend_style: api-only-backend-vitepress-docs
testing_strategy: minimal-placeholder
security_style: policy-based-with-gate
authorization_style: spatie-permissions-with-ownership
notification_pattern: multi-channel-dispatch
filter_pattern: pipeline-filter-pattern
translation_pattern: dual-language-arabic-english
module_system: nwidart-modules
realtime: laravel-reverb-websocket
auth: sanctum-token-otp-ldap
soft_delete: trait-based-soft-delete
activity_logging: spatie-activitylog
media_management: hasanhawary-media-manager
settings: dynamic-settings-with-env-sync
branding: multi-brand-with-seeders
permission_generation: hasanhawary-permission-manager
enum_pattern: backed-enums-with-enum-methods-trait
helper_loading: composer-autoload-files

# Layer responsibilities
layers:
  controller:
    - authorize_requests_via_gate_or_policy
    - delegate_complex_logic_to_services
    - return_response_via_helper_functions
    - use_pipeline_for_list_queries
    - type_hint_form_requests_for_validation
  service:
    - contain_business_logic
    - manage_database_transactions
    - handle_relationship_syncing
    - dispatch_jobs_and_notifications
    - be_injected_via_constructor
  model:
    - define_fillable_and_casts
    - define_relationships_with_return_types
    - use_traits_for_reusable_behavior
    - use_attribute_accessors_for_transformations
    - declare_permission_operations
  request:
    - extend_base_form_request
    - define_validation_rules
    - prepare_input_in_prepareForValidation
    - return_only_validated_data
  resource:
    - transform_model_data_for_api
    - use_whenLoaded_for_conditional_relations
    - include_display_fields_for_translations_and_enums
    - return_plain_arrays_from_toArray

# Naming conventions
naming:
  controllers: PascalCase + Controller suffix, grouped by domain
  services: PascalCase + Service suffix, grouped by domain
  models: PascalCase singular
  enums: PascalCase + Enum suffix, grouped by domain
  traits: PascalCase, grouped in Trait/Global/
  scopes: PascalCase + Scopes suffix, grouped by domain
  filters: PascalCase + Filter suffix, grouped by domain
  requests: PascalCase + Request suffix, grouped by domain
  resources: PascalCase + Resource suffix, grouped by domain
  policies: PascalCase + Policy suffix, grouped by domain
  helpers: camelCase functions in app/Helpers/App.php
  exceptions: PascalCase + Exception suffix
  jobs: PascalCase based on action
  middleware: PascalCase + Middleware suffix
  migrations: snake_case with date prefix

# Folder organization
folder_structure:
  app/
    Console/Commands/
    Enum/Global/ and Enum/User/
    Events/
    Exceptions/
    Filters/Global/ and Filters/{Domain}/
    Guards/
    Helpers/
    Http/
      Controllers/API/{Domain}/
      Middleware/
      Requests/{Domain}/
      Resources/{Domain}/
    Jobs/
    Mail/
    Models/
    Notifications/
    Policies/{Domain}/
    Providers/
    Rules/
    Scopes/{Domain}/
    Services/{Domain}/
    Tools/{Domain}/
    Trait/Global/
  Modules/{ModuleName}/
    app/
    Controllers/
    Enum/
    Export/
    Filters/
    Http/
    Jobs/
    Models/
    Policies/
    Providers/
    Scopes/
    Services/
    config/
    database/migrations/
    lang/{locale}/
    routes/
  config/
  database/factories/ and seeders/
  tests/Feature/ and Unit/

# Response format
response_format:
  success:
    status: true
    code: 200
    message: "translation key"
    data: { resource or collection }
  failure:
    status: false
    code: 400+
    message: "error message"
    data: {}

# Permission convention
permission_naming: "{operation}-{model-snake}"
permission_operations:
  basic: [create, update, delete, read]
  special: [view-all, view-own, restore, force-delete, toggle-active]
model_permission_flag: "public bool $inPermission"
